<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF9F7">
<title>כלי ההדרכה — בית הספר להדרכה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F7; --card:#FFFFFF; --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#A1A1A6;
  --line:#ECEAE5; --fill:#F1F0EC; --blue:#2F63A8;
  --ease:cubic-bezier(.22,1,.36,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#FAF9F7; } }
:root[data-theme="dark"]{ --bg:#FAF9F7; }
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid #9DB8E0;outline-offset:3px;border-radius:12px}

.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 60px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(250,249,247,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .3s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mini{font-weight:800;font-size:17px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s var(--ease)}
.top.scrolled .mini{opacity:1;transform:none}
.badge{font-size:12px;font-weight:700;color:#4F6B4C;background:#E6EFE1;border-radius:999px;padding:5px 12px;white-space:nowrap}

.greet{font-size:15px;color:var(--ink-2);font-weight:500;margin:6px 0 4px}
h1{font-size:clamp(36px,8vw,58px);font-weight:900;letter-spacing:-1.5px;line-height:1.02;margin:0 0 22px}

.search{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:14px;padding:0 14px;height:46px;margin-bottom:28px;transition:background .2s,box-shadow .2s}
.search:focus-within{background:#fff;box-shadow:0 0 0 1px var(--line),0 6px 20px rgba(30,30,40,.06)}
.search svg{flex-shrink:0;color:var(--ink-3)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.clear{width:22px;height:22px;border-radius:50%;background:#C7C7CC;color:#fff;display:none;align-items:center;justify-content:center;font-size:13px;line-height:1}
.search.has .clear{display:flex}

/* featured carousel */
.feat{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px 10px;padding:4px 20px 18px;scrollbar-width:none}
.feat::-webkit-scrollbar{display:none}
.fcard{position:relative;flex:0 0 min(88%,520px);height:clamp(300px,62vw,380px);border-radius:28px;overflow:hidden;scroll-snap-align:center;text-align:right;transition:transform .35s var(--ease)}
.fcard:active{transform:scale(.97)}
.fcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fcard .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.18) 42%,rgba(255,255,255,0) 60%)}
.fcard .txt{position:absolute;top:22px;right:22px;left:22px}
.fcard .k{font-size:13px;font-weight:700;opacity:.75}
.fcard .n{font-size:clamp(28px,6vw,36px);font-weight:900;letter-spacing:-.8px;line-height:1.05;margin-top:4px}
.fcard .d{font-size:14px;margin-top:8px;max-width:300px;opacity:.85;line-height:1.45}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:26px}
.dots i{width:6px;height:6px;border-radius:3px;background:#D6D5D0;transition:width .3s var(--ease),background .3s}
.dots i.on{width:18px;background:#8E8E93}

/* recent */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.sec-h h2{font-size:24px;font-weight:900;letter-spacing:-.5px;margin:0}
.recent{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;margin-bottom:30px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rc{flex:0 0 auto;width:74px;text-align:center}
.rc .th{width:74px;height:74px;border-radius:20px;overflow:hidden;transition:transform .25s var(--ease)}
.rc:active .th{transform:scale(.93)}
.rc .th img{width:100%;height:100%;object-fit:cover}
.rc span{display:block;font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.25}

/* segmented */
.seg{display:inline-flex;background:var(--fill);border-radius:11px;padding:3px;margin-bottom:18px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;padding:7px 16px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:color .2s}
.seg button.on{color:var(--ink);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/5;text-align:right;transition:transform .3s var(--ease),box-shadow .3s}
.tile.wide{grid-column:span 2;aspect-ratio:8/5}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.tile.wide{aspect-ratio:auto}}
@media(hover:hover){.tile:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(40,40,60,.10)}}
.tile:active{transform:scale(.97)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
@media(hover:hover){.tile:hover img{transform:scale(1.04)}}
.tile .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.78) 0%,rgba(255,255,255,.25) 34%,rgba(255,255,255,0) 52%)}
.tile .txt{position:absolute;top:16px;right:16px;left:16px}
.tile .k{font-size:12px;font-weight:700;opacity:.72}
.tile .n{font-size:clamp(17px,4.4vw,21px);font-weight:900;letter-spacing:-.3px;line-height:1.12;margin-top:3px}
.tile.wide .n{font-size:clamp(20px,5vw,26px)}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--ink-2);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:800;margin-bottom:4px}

.foot{text-align:center;color:var(--ink-3);font-size:12px;margin-top:44px}

/* entrance: one orchestrated moment */
.rise{opacity:0;transform:translateY(16px);animation:rise .7s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(30,30,35,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:94vh;background:#fff;border-radius:28px 28px 0 0;overflow:hidden auto;transform:translateY(105%);transition:transform .5s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
@media(min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;border-radius:30px;transform:translate(-50%,-44%) scale(.94);opacity:0;transition:transform .45s var(--ease),opacity .3s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
}
.s-img{position:relative;height:min(46vh,340px)}
.s-img img{width:100%;height:100%;object-fit:cover}
.s-img::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(0deg,#fff,rgba(255,255,255,0))}
.x{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:2}
.grab{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.9);z-index:2}
@media(min-width:760px){.grab{display:none}}
.s-body{padding:4px 24px 26px;margin-top:-30px;position:relative}
.s-k{font-size:13px;font-weight:700}
.s-n{font-size:30px;font-weight:900;letter-spacing:-.7px;line-height:1.08;margin:4px 0 10px}
.s-d{font-size:16px;line-height:1.6;color:var(--ink-2);margin:0 0 22px;max-width:60ch}
.open{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;font-size:17px;font-weight:800;text-decoration:none;transition:transform .2s var(--ease),filter .2s}
.open:active{transform:scale(.98)}
@media(hover:hover){.open:hover{filter:brightness(.97)}}
.copy{display:block;margin:14px auto 0;font-size:15px;font-weight:500;color:var(--blue);padding:6px 10px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:rgba(29,29,31,.88);color:#fff;font-size:14px;font-weight:500;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s,transform .3s var(--ease);z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="top-in">
    <div class="mini">כלי ההדרכה</div>
    <div class="badge" id="count"></div>
  </div>
</header>

<main class="wrap">
  <div class="rise" style="animation-delay:.02s">
    <div class="greet" id="greet"></div>
    <h1>מה נפתח היום?</h1>
  </div>

  <label class="search rise" id="searchBox" style="animation-delay:.08s">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="חיפוש כלי, נושא או קורס" autocomplete="off" aria-label="חיפוש כלי">
    <button class="clear" id="clear" type="button" aria-label="ניקוי חיפוש">✕</button>
  </label>

  <section id="featWrap" class="rise" style="animation-delay:.14s" aria-label="כלים נבחרים">
    <div class="feat" id="feat"></div>
    <div class="dots" id="dots"></div>
  </section>

  <section id="recentWrap" hidden aria-label="נפתחו לאחרונה">
    <div class="sec-h"><h2>נפתחו לאחרונה</h2></div>
    <div class="recent" id="recent"></div>
  </section>

  <section aria-label="כל הכלים">
    <div class="sec-h rise" style="animation-delay:.2s"><h2 id="gridTitle">כל הכלים</h2></div>
    <div class="seg rise" id="seg" role="tablist" style="animation-delay:.22s"></div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="foot">בית הספר להדרכה · זרוע היבשה</div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sN">
  <div class="s-img">
    <div class="grab"></div>
    <button class="x" id="close" type="button" aria-label="סגירה">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <img id="sImg" alt="">
  </div>
  <div class="s-body">
    <div class="s-k" id="sK"></div>
    <div class="s-n" id="sN"></div>
    <p class="s-d" id="sD"></p>
    <a class="open" id="sOpen" target="_blank" rel="noopener">פתח את הכלי</a>
    <button class="copy" id="sCopy" type="button">העתק קישור</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pic = t => IMAGES[t.img] || "";
let cat = "הכל", query = "", lastFocus = null;

/* greeting + count */
(function(){
  const h = new Date().getHours();
  const g = h < 5 ? "לילה טוב" : h < 12 ? "בוקר טוב" : h < 17 ? "צהריים טובים" : h < 21 ? "ערב טוב" : "לילה טוב";
  const d = new Intl.DateTimeFormat("he-IL",{weekday:"long",day:"numeric",month:"long"}).format(new Date());
  $("#greet").textContent = g + ", " + d;
  $("#count").textContent = TOOLS.length + " כלים";
})();

/* featured */
function renderFeatured(){
  const f = TOOLS.filter(t => t.featured);
  $("#feat").innerHTML = f.map(t => `
    <button class="fcard" data-id="${t.id}" style="background:${t.bg};color:${t.ink}" aria-label="${esc(t.name)}">
      <img src="${pic(t)}" alt="" loading="eager">
      <div class="veil"></div>
      <div class="txt"><div class="k">${esc(t.cat)}</div><div class="n">${esc(t.name)}</div><div class="d">${esc(t.desc)}</div></div>
    </button>`).join("");
  $("#dots").innerHTML = f.map((_,i)=>`<i class="${i===0?"on":""}"></i>`).join("");
  const feat = $("#feat");
  feat.addEventListener("scroll", () => {
    const cards = [...feat.children]; if(!cards.length) return;
    const mid = feat.getBoundingClientRect().left + feat.clientWidth/2;
    let best = 0, bd = 1e9;
    cards.forEach((c,i)=>{ const r=c.getBoundingClientRect(); const d=Math.abs(r.left+r.width/2-mid); if(d<bd){bd=d;best=i;} });
    [...$("#dots").children].forEach((d,i)=>d.classList.toggle("on", i===best));
  }, {passive:true});
}

/* segmented */
function renderSeg(){
  $("#seg").innerHTML = CATS.map(c => `<button role="tab" aria-selected="${c===cat}" class="${c===cat?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}

/* grid */
function renderGrid(animate){
  const q = query.trim();
  const list = TOOLS.filter(t => (cat==="הכל" || t.cat===cat) &&
    (!q || (t.name+" "+t.cat+" "+t.desc).includes(q)));
  $("#gridTitle").textContent = q ? "תוצאות חיפוש" : (cat==="הכל" ? "כל הכלים" : cat);
  if(!list.length){
    $("#grid").innerHTML = `<div class="empty"><b>לא נמצא כלי שמתאים לחיפוש</b>נסו מילה אחרת, או חזרו לכל הכלים.</div>`;
    return;
  }
  $("#grid").innerHTML = list.map((t,i) => {
    const wide = list.length > 2 && i % 5 === 2;
    return `<button class="tile${wide?" wide":""}${animate?" rise":""}" data-id="${t.id}"
      style="background:${t.bg};color:${t.ink};${animate?`animation-delay:${.26+i*.05}s`:""}" aria-label="${esc(t.name)}">
      <img src="${pic(t)}" alt="" loading="lazy">
      <div class="veil"></div>
      <div class="txt"><div class="k">${esc(t.cat)}</div><div class="n">${esc(t.name)}</div></div>
    </button>`;
  }).join("");
}

/* recent (per-viewer, local) */
const RKEY = "hadracha_hub_recent";
function getRecent(){ try{ return JSON.parse(localStorage.getItem(RKEY)) || []; }catch(e){ return []; } }
function pushRecent(id){
  try{ const r = getRecent().filter(x=>x!==id); r.unshift(id); localStorage.setItem(RKEY, JSON.stringify(r.slice(0,8))); }catch(e){}
  renderRecent();
}
function renderRecent(){
  const r = getRecent().map(id => TOOLS.find(t=>t.id===id)).filter(Boolean);
  $("#recentWrap").hidden = !r.length || !!query.trim();
  $("#recent").innerHTML = r.map(t => `
    <button class="rc" data-id="${t.id}" aria-label="${esc(t.name)}">
      <div class="th" style="background:${t.bg}"><img src="${pic(t)}" alt=""></div>
      <span>${esc(t.name)}</span>
    </button>`).join("");
}

/* sheet */
function openSheet(id){
  const t = TOOLS.find(x=>x.id===id); if(!t) return;
  lastFocus = document.activeElement;
  $("#sImg").src = pic(t);
  $("#sK").textContent = t.cat; $("#sK").style.color = t.ink;
  $("#sN").textContent = t.name;
  $("#sD").textContent = t.desc;
  const o = $("#sOpen"); o.href = t.url; o.style.background = t.bg; o.style.color = t.ink;
  o.dataset.id = t.id; $("#sCopy").dataset.url = t.url;
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
  document.body.style.overflow = "hidden";
  setTimeout(()=>$("#close").focus({preventScroll:true}), 60);
}
function closeSheet(){
  $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
  document.body.style.overflow = "";
  if(lastFocus) lastFocus.focus({preventScroll:true});
}
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove("on"), 1800);
}

/* events */
document.addEventListener("click", e => {
  const card = e.target.closest("[data-id].fcard, [data-id].tile, [data-id].rc");
  if(card){ openSheet(card.dataset.id); return; }
  const s = e.target.closest("#seg button");
  if(s){ cat = s.dataset.cat; renderSeg(); renderGrid(false); }
});
$("#sOpen").addEventListener("click", e => pushRecent(e.currentTarget.dataset.id));
$("#sCopy").addEventListener("click", async e => {
  const url = e.currentTarget.dataset.url;
  try{ await navigator.clipboard.writeText(url); toast("הקישור הועתק"); }
  catch(err){
    const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("הקישור הועתק"); }catch(_){ toast("לא ניתן להעתיק כאן"); }
    ta.remove();
  }
});
$("#close").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });

const qEl = $("#q");
qEl.addEventListener("input", () => {
  query = qEl.value;
  $("#searchBox").classList.toggle("has", !!query);
  $("#featWrap").hidden = !!query.trim();
  renderRecent(); renderGrid(false);
});
$("#clear").addEventListener("click", e => { e.preventDefault(); qEl.value=""; qEl.dispatchEvent(new Event("input")); qEl.focus(); });

window.addEventListener("scroll", () => $("#top").classList.toggle("scrolled", window.scrollY > 70), {passive:true});

renderFeatured(); renderSeg(); renderGrid(true); renderRecent();
</script>
</body>
</html>
